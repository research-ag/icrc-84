name: App build
on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review, unlabeled]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install mops
        uses: caffeinelabs/setup-mops@v1

      - name: Make sure moc is installed
        run: mops toolchain bin moc || mops toolchain use moc latest

      - name: Run mops tests
        run: mops test --locked

      - name: Build example actor
        working-directory: example
        run: $(mops toolchain bin moc) $(mops sources) actor.mo --idl

      - name: Get didc
        # Pinned: candid's "latest" release can be a candid_ui-only release without didc.
        env:
          DIDC_VERSION: didc-v0.6.2
        run: |
          mkdir -p /home/runner/bin
          tmpdir=$(mktemp -d)
          base="https://github.com/dfinity/candid/releases/download/$DIDC_VERSION/didc-x86_64-unknown-linux-gnu.tar.xz"
          curl -fsSL "$base" -o "$tmpdir/didc.tar.xz"
          curl -fsSL "$base.sha256" | awk 'NF { print $1 "  didc.tar.xz" }' > "$tmpdir/didc.tar.xz.sha256"
          (cd "$tmpdir" && sha256sum -c didc.tar.xz.sha256)
          tar -xJf "$tmpdir/didc.tar.xz" -C "$tmpdir"
          find "$tmpdir" -type f -name didc -exec cp {} /home/runner/bin/didc \;
          chmod +x /home/runner/bin/didc
          echo "/home/runner/bin" >> $GITHUB_PATH

      - name: Check public did file against icrc84 standard
        run: |
          didc check example/actor.did icrc-84.did
          didc check icrc-84.did example/actor.did

  format:
    name: Check formatting
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install prettier plugin
        run: npm install --save-dev prettier prettier-plugin-motoko

      - name: Run prettier check
        run: npx prettier --check --plugin=prettier-plugin-motoko '**/*.{mo,json,md}'
